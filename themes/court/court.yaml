name: Court
version: 1.0.0
description: 'A modern club homepage with bold editorial type, original court artwork, prominent training links and recent news. Responsive, accessible navigation, automatic dark mode and no external fonts or scripts.'
author: moritz
homepage: https://github.com/moritzfl/Typemill-Plugins
license: GPL-2.0

settings:
  heroEyebrow: ''
  heroTitle: ''
  heroSubtitle: ''
  heroBtnLabel: ''
  heroBtnLink: ''
  heroLinkLabel: ''
  heroLinkTarget: ''
  heroImageStyle: auto
  showTiles: true
  tilesTitle: ''
  tilesLead: ''
  blog: false
  showNews: true
  newsTitle: ''
  blogfolder: '/news'
  blogimage: true
  blogintro: false
  blogpagesize: 9
  breadcrumb: true
  showDescription: false
  accentColor: ''
  courtColor: ''
  maxwidth: ''
  customcss: ''
  # Left empty on purpose: the templates fall back on the theme's own
  # translation, so a German site reads German. A value here would win over it.
  homeLabel: ''
  readMore: ''
  previous: ''
  next: ''
  dateFormat: 'd.m.Y'

readymades:

  sportsclub:
    name: 'Sports club'
    description: 'Editorial club homepage with a training CTA, quick links, and recent news. Defaults match a small German Verein site.'
    settings:
      heroEyebrow: 'Willkommen'
      heroTitle: 'Trainieren. Spielen. Dazugehören.'
      heroSubtitle: 'Trainingszeiten, Neuigkeiten und alles, was zur Sparte gehört.'
      heroBtnLabel: 'Zu den Trainingszeiten'
      heroBtnLink: '/trainingszeiten'
      heroLinkLabel: 'Neues'
      heroLinkTarget: '/news'
      heroImageStyle: auto
      showNews: true
      showTiles: true
      tilesTitle: 'Auf einen Blick'
      tilesLead: ''
      blog: false
      blogfolder: '/news'
      breadcrumb: true
      showDescription: false
      dateFormat: d.m.Y
      footercolumns:
          - footer1
          - footer2
      footer1: "## Die Sparte\n\nKurzer Text über die Mannschaft und wer trainiert."
      footer2: "## Kontakt\n\n* [Impressum](/)\n* [Datenschutz](/)"

  newsroom:
    name: 'News homepage'
    description: 'Homepage as the news list. Point the blog folder at your news section.'
    settings:
      blog: true
      blogfolder: '/news'
      blogimage: true
      blogintro: true
      blogpagesize: 9
      heroTitle: 'Neues'
      heroSubtitle: 'Was gerade in der Sparte passiert.'
      showTiles: false
      breadcrumb: true
      datePosition:
          - top
      dateFormat: d.m.Y

forms:
  fields:

    fieldsetHero:
      type: fieldset
      legend: 'Homepage Hero'
      fields:
        heroImageStyle:
          type: select
          label: 'Homepage image treatment'
          description: 'Auto displays SVG crests with the court artwork and other images as a full-height photo. Select Crest for a PNG or JPEG logo.'
          options:
            auto: 'Auto'
            crest: 'Club crest + court artwork'
            photo: 'Full-height photo'
        heroEyebrow:
          type: text
          label: 'Eyebrow (small line above the headline)'
          placeholder: 'Willkommen'
        heroTitle:
          type: text
          label: 'Headline'
          placeholder: 'SUS Sehnde Badminton'
        heroSubtitle:
          type: textarea
          label: 'Lead under the headline'
        heroBtnLabel:
          type: text
          label: 'Primary button label'
          placeholder: 'Zu den Trainingszeiten'
          css: 'w-half'
        heroBtnLink:
          type: text
          label: 'Primary button link'
          placeholder: '/trainingszeiten'
          css: 'w-half'
          description: 'Leave the primary action empty to link to the first navigation page automatically.'
        heroLinkLabel:
          type: text
          label: 'Secondary link label'
          placeholder: 'Neues'
          css: 'w-half'
        heroLinkTarget:
          type: text
          label: 'Secondary link target'
          placeholder: '/news'
          css: 'w-half'

    fieldsetTiles:
      type: fieldset
      legend: 'Homepage quick links'
      fields:
        showTiles:
          type: checkbox
          label: 'Quick links'
          checkboxlabel: 'Show a numbered link to each top-level page'
        tilesTitle:
          type: text
          label: 'Section title'
          placeholder: 'Auf einen Blick'
        tilesLead:
          type: text
          label: 'Lead under the section title'

    fieldsetBlog:
      type: fieldset
      legend: 'News / blog'
      fields:
        showNews:
          type: checkbox
          label: 'Club homepage'
          checkboxlabel: 'Show the three latest posts below the homepage content'
        newsTitle:
          type: text
          label: 'Homepage news heading'
          description: 'Empty uses the site language. Only published posts from the configured folder appear.'
        blog:
          type: checkbox
          label: 'Homepage'
          checkboxlabel: 'Use the homepage as the post list'
        blogfolder:
          type: text
          label: 'Posts folder'
          placeholder: '/news'
        blogimage:
          type: checkbox
          label: 'Images'
          checkboxlabel: 'Show each post’s hero image'
        blogintro:
          type: checkbox
          label: 'Intro'
          checkboxlabel: 'Show the homepage body above the list'
        blogpagesize:
          type: number
          label: 'Posts per page'
          min: 1

    fieldsetPage:
      type: fieldset
      legend: 'Pages'
      fields:
        breadcrumb:
          type: checkbox
          label: 'Breadcrumb'
          checkboxlabel: 'Show the path above the title'
        showDescription:
          type: checkbox
          label: 'Description'
          checkboxlabel: 'Show the meta description as a lead'
        datePosition:
          type: checkboxlist
          label: 'Show the date'
          options:
            top: 'Under the title'
        authorPosition:
          type: checkboxlist
          label: 'Show the author'
          options:
            top: 'Under the title'
        dateIntro:
          type: text
          label: 'Word before the date'
          placeholder: 'Stand'
          css: 'w-half'
        authorIntro:
          type: text
          label: 'Word before the author'
          placeholder: 'Von'
          css: 'w-half'
        dateFormat:
          type: text
          label: 'Date format (PHP)'
          placeholder: 'd.m.Y'
        homeLabel:
          type: text
          label: 'Home crumb label'
        readMore:
          type: text
          label: 'Read-more label'
        previous:
          type: text
          label: 'Previous label'
        next:
          type: text
          label: 'Next label'

    fieldsetLook:
      type: fieldset
      legend: 'Look'
      fields:
        courtColor:
          type: text
          label: 'Court (artwork and footer)'
          placeholder: '#0c3169'
          description: 'A CSS colour for the court artwork and footer. Empty keeps the default navy.'
        accentColor:
          type: text
          label: 'Accent (buttons and links)'
          placeholder: '#d5ef57'
          description: 'A CSS colour for buttons and links. Empty keeps the default shuttle lime.'
        maxwidth:
          type: text
          label: 'Content width'
          placeholder: '1200px'
        customcss:
          type: textarea
          label: 'Custom CSS'

    fieldsetFooter:
      type: fieldset
      legend: 'Footer'
      fields:
        footercolumns:
          type: checkboxlist
          label: 'Columns to show'
          options:
            footer1: 'Column 1'
            footer2: 'Column 2'
            footer3: 'Column 3'
        footer1:
          type: textarea
          label: 'Column 1 (Markdown)'
        footer2:
          type: textarea
          label: 'Column 2 (Markdown)'
        footer3:
          type: textarea
          label: 'Column 3 (Markdown)'
        copyrightline:
          type: checkbox
          label: 'Copyright'
          checkboxlabel: 'Replace the default line with own text'
        copyrightlinetext:
          type: textarea
          label: 'Own copyright line (Markdown)'
