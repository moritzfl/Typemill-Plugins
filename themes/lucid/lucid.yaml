name: Lucid
version: 1.0.0
description: 'A calm, spacious product-page theme: generous whitespace, large tightly tracked headlines, fully rounded buttons, alternating light sections and a translucent sticky header. Uses the system font stack, so each platform renders its own interface typeface and no font files are shipped. Automatic dark mode.'
author: moritz
homepage: https://github.com/moritzfl/Typemill-Plugins
license: GPL-2.0

settings:
  heroEyebrow: ''
  heroTitle: ''
  heroSubtitle: ''
  heroBtnLabel: ''
  heroBtnLink: ''
  heroLinkLabel: ''
  heroLinkTarget: ''
  showTiles: true
  tilesTitle: ''
  tilesLead: ''
  tilesLinkLabel: 'Learn more'
  tilesCountLabel: 'pages'
  blog: false
  blogfolder: '/blog'
  blogimage: true
  blogintro: false
  blogpagesize: 9
  breadcrumb: true
  showDescription: false
  accentColor: ''
  maxwidth: ''
  customcss: ''
  homeLabel: 'Home'
  readMore: 'Read more'
  previous: 'Previous'
  next: 'Next'
  dateFormat: 'd.m.Y'

forms:
  fields:

    fieldsetHero:
      type: fieldset
      legend: 'Homepage Hero'
      fields:
        heroEyebrow:
          type: text
          label: 'Eyebrow (small line above the headline)'
          placeholder: 'New'
          css: 'lg:w-half'
        heroTitle:
          type: text
          label: 'Headline'
          description: 'Defaults to the homepage title if left blank.'
          placeholder: 'Built for what comes next.'
          css: 'lg:w-half'
        heroSubtitle:
          type: text
          label: 'Subheadline'
          placeholder: 'A short sentence that sets the scene.'
          css: 'lg:w-full'
        heroBtnLabel:
          type: text
          label: 'Button label'
          placeholder: 'Get started'
          css: 'lg:w-half'
        heroBtnLink:
          type: text
          label: 'Button link'
          placeholder: '/docs'
          css: 'lg:w-half'
        heroLinkLabel:
          type: text
          label: 'Secondary link label'
          placeholder: 'Learn more'
          css: 'lg:w-half'
        heroLinkTarget:
          type: text
          label: 'Secondary link target'
          placeholder: '/about'
          css: 'lg:w-half'

    fieldsetTiles:
      type: fieldset
      legend: 'Homepage Section Tiles'
      fields:
        showTiles:
          type: checkbox
          label: 'Section tiles'
          checkboxlabel: 'Show a tile for each top-level section on the homepage'
        tilesTitle:
          type: text
          label: 'Tiles heading'
          placeholder: 'Explore'
          css: 'lg:w-half'
        tilesLead:
          type: text
          label: 'Tiles intro text'
          css: 'lg:w-half'
        tilesLinkLabel:
          type: text
          label: 'Tile link label'
          placeholder: 'Learn more'
          css: 'lg:w-half'
        tilesCountLabel:
          type: text
          label: 'Word used after the page count'
          placeholder: 'pages'
          css: 'lg:w-half'

    fieldsetBlog:
      type: fieldset
      legend: 'Blog / Posts'
      fields:
        blog:
          type: checkbox
          label: 'Blog homepage'
          checkboxlabel: 'Use the homepage as a post listing instead of the hero layout'
        blogintro:
          type: checkbox
          label: 'Page intro'
          checkboxlabel: 'Show the homepage content above the post list'
        blogimage:
          type: checkbox
          label: 'Post images'
          checkboxlabel: 'Show hero images in post cards'
        blogfolder:
          type: text
          label: 'Blog folder'
          placeholder: '/blog'
          description: 'Relative path to the folder that holds the posts.'
          css: 'lg:w-half'
        blogpagesize:
          type: number
          label: 'Posts per page'
          placeholder: '9'
          css: 'lg:w-half'

    fieldsetLayout:
      type: fieldset
      legend: 'Layout'
      fields:
        breadcrumb:
          type: checkbox
          label: 'Breadcrumb'
          checkboxlabel: 'Show a breadcrumb above the page title'
        showDescription:
          type: checkbox
          label: 'Page lead text'
          checkboxlabel: 'Show the page description under the title'
          description: 'Only useful when descriptions are written by hand. Descriptions generated by Typemill are cut off mid-sentence.'
        maxwidth:
          type: text
          label: 'Content width'
          placeholder: '1068px'
          description: 'Any CSS length. Leave blank for the 1068px default.'
          css: 'lg:w-half'
        dateFormat:
          type: select
          label: 'Date format'
          css: 'lg:w-half'
          options:
            'd.m.Y': '20.01.2020'
            'm/d/Y': '01/20/2020'
            'Y-m-d': '2020-01-20'

    fieldsetMeta:
      type: fieldset
      legend: 'Article Meta'
      fields:
        datePosition:
          type: checkboxlist
          label: 'Show date'
          options:
            top: Top
        dateIntro:
          type: text
          label: 'Date intro text'
          placeholder: 'Updated'
          css: 'lg:w-half'
        authorPosition:
          type: checkboxlist
          label: 'Show author'
          options:
            top: Top
        authorIntro:
          type: text
          label: 'Author intro text'
          placeholder: 'By'
          css: 'lg:w-half'

    fieldsetLabels:
      type: fieldset
      legend: 'Labels'
      fields:
        homeLabel:
          type: text
          label: 'Home label (breadcrumb, 404)'
          placeholder: 'Home'
          css: 'lg:w-half'
        readMore:
          type: text
          label: 'Read more label'
          placeholder: 'Read more'
          css: 'lg:w-half'
        previous:
          type: text
          label: 'Previous label'
          placeholder: 'Previous'
          css: 'lg:w-half'
        next:
          type: text
          label: 'Next label'
          placeholder: 'Next'
          css: 'lg:w-half'
        notFoundTitle:
          type: text
          label: '404 headline'
          placeholder: 'Page not found'
          css: 'lg:w-half'
        notFoundText:
          type: text
          label: '404 text'
          placeholder: 'The page you were looking for is not here.'
          css: 'lg:w-half'

    fieldsetColors:
      type: fieldset
      legend: 'Colors'
      fields:
        accentColor:
          type: text
          label: 'Accent color'
          placeholder: '#0071e3'
          description: 'Any CSS color. Leave blank for the default blue.'
          css: 'lg:w-half'
        customcss:
          type: textarea
          label: 'Custom CSS'
          description: 'Injected verbatim into a &lt;style&gt; tag.'

    fieldsetFooter:
      type: fieldset
      legend: 'Footer Columns'
      fields:
        footercolumns:
          type: checkboxlist
          label: 'Active footer columns'
          options:
            footer1: 'Column 1'
            footer2: 'Column 2'
            footer3: 'Column 3'
        footer1:
          type: textarea
          label: 'Footer column 1 (Markdown)'
        footer2:
          type: textarea
          label: 'Footer column 2 (Markdown)'
        footer3:
          type: textarea
          label: 'Footer column 3 (Markdown)'

    fieldsetCopyright:
      type: fieldset
      legend: 'Copyright Line'
      fields:
        copyrightline:
          type: checkbox
          checkboxlabel: 'Override the default copyright line'
        copyrightlinetext:
          type: textarea
          label: 'Custom copyright text (Markdown)'
