GITUPDATE_CONFIRM: Ja, fortfahren
GITUPDATE_BLOCKED: Die PHP-Zip-Erweiterung fehlt, daher kann ein Update nicht entpackt werden.
GITUPDATE_ADMIN_ONLY: Nur ein Administrator kann ein Update ausführen.
