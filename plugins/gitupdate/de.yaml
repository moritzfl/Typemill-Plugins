GITUPDATE_TITLE: Git-Update
GITUPDATE_SUBTITLE: "Aktualisiert Plugins und Themes aus dem Git-Repository, die bereits installiert sind. Jeder Commit ist ein Release. Alles andere auf dem Server bleibt unberührt."
GITUPDATE_LOADING: Laden
GITUPDATE_CHECK: Erneut prüfen
GITUPDATE_HEAD: Neuester Commit
GITUPDATE_UP_TO_DATE: Alles, was aus diesem Repository installiert ist, ist auf dem neuesten Commit.
