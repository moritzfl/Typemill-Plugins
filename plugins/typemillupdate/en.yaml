TYPEMILLUPDATE_CONFIRM_TITLE: Update Typemill?
TYPEMILLUPDATE_CONFIRM_TEXT: The system folder will be replaced. Your content, media, settings, plugins and themes stay untouched, and the current core is kept so it can be restored.
TYPEMILLUPDATE_CONFIRM_RESTORE_TITLE: Restore this version?
TYPEMILLUPDATE_CONFIRM_RESTORE_TEXT: The current core will be replaced by the stored one.
TYPEMILLUPDATE_CANCEL: Cancel
TYPEMILLUPDATE_CONFIRM: Yes, continue
TYPEMILLUPDATE_RELOAD: Reload the page to use the new version.
TYPEMILLUPDATE_PHP: PHP version
TYPEMILLUPDATE_UPLOAD_TITLE: Install from a file
TYPEMILLUPDATE_UPLOAD_HELP: "Upload a Typemill ZIP to install a specific version, for example to go back to an older release or when this server cannot reach typemill.net. The archive must contain system/typemill and system/vendor; downloads from GitHub do not, because they leave out the dependencies."
TYPEMILLUPDATE_UPLOADING: Uploading
TYPEMILLUPDATE_UPLOADED_VERSION: Version in the file
TYPEMILLUPDATE_UPLOADED_SIZE: File
TYPEMILLUPDATE_CONFIRM_UPLOAD_TITLE: Install this version?
TYPEMILLUPDATE_CONFIRM_UPLOAD_TEXT: The system folder will be replaced with the core from this file. Your content, media, settings, plugins and themes stay untouched, and the current core is kept so it can be restored.
TYPEMILLUPDATE_DOWNGRADE_WARNING: This is older than the version you have installed.
TYPEMILLUPDATE_REINSTALL_WARNING: This is the version you already have installed.
TYPEMILLUPDATE_CHECK_ZIPARCHIVE_OK: The PHP zip extension is available.
TYPEMILLUPDATE_CHECK_ZIPARCHIVE_MISSING: The PHP zip extension is missing, so the release archive cannot be unpacked.
TYPEMILLUPDATE_CHECK_SYSTEM_LAYOUT_OK: Found system/typemill and system/vendor in {root}.
TYPEMILLUPDATE_CHECK_SYSTEM_LAYOUT_MISSING: Could not find system/typemill and system/vendor in {root}.
TYPEMILLUPDATE_CHECK_SYSTEM_LAYOUT_SYMLINK: The system directory is a symlink; replacing it is not supported.
TYPEMILLUPDATE_CHECK_VENDOR_LOCATION_OK: Composer packages live in system/vendor, as expected.
TYPEMILLUPDATE_CHECK_VENDOR_LOCATION_LEGACY: This installation keeps Composer packages in <root>/vendor, which predates Typemill 2.23. Update manually.
TYPEMILLUPDATE_CHECK_ROOT_WRITABLE_OK: PHP can create and rename entries in the project root.
TYPEMILLUPDATE_CHECK_ROOT_WRITABLE_NOCREATE: PHP cannot create entries in {root}. This usually means the files belong to a different user than the web server.
TYPEMILLUPDATE_CHECK_ROOT_WRITABLE_NORENAME: PHP cannot rename entries in {root}, which the update needs in order to swap the system directory.
TYPEMILLUPDATE_CHECK_OPCACHE_OFF: OPcache is not enabled.
TYPEMILLUPDATE_CHECK_OPCACHE_RESET: OPcache is enabled and will be reset after the swap.
TYPEMILLUPDATE_CHECK_OPCACHE_RESET_STALE: "OPcache runs with validate_timestamps off; it will be reset after the swap."
TYPEMILLUPDATE_CHECK_OPCACHE_REVALIDATES: OPcache is enabled and revalidates by timestamp.
TYPEMILLUPDATE_CHECK_OPCACHE_MANUAL_RESTART: OPcache has validate_timestamps off and opcache_reset() is unavailable. Restart PHP after updating.
COULD_NOT_DETERMINE_THE_INSTALLED_TYPEMILL_VERSION: Could not determine the installed Typemill version.
THIS_INSTALLATION_CANNOT_UPDATE_ITSELF_SEE_THE_ENVIRONMENT_CHECKS: This installation cannot update itself. See the environment checks.
THAT_UPLOADED_ARCHIVE_COULD_NOT_BE_FOUND_PLEASE_UPLOAD_IT_AGAIN: That uploaded archive could not be found. Please upload it again.
THAT_IS_NOT_A_VALID_VERSION_NUMBER: That is not a valid version number.
ANOTHER_UPDATE_IS_ALREADY_RUNNING: Another update is already running.
COULD_NOT_CREATE_THE_WORKING_DIRECTORY: Could not create the working directory.
INVALID_UPLOAD: Invalid upload.
THAT_BACKUP_COULD_NOT_BE_FOUND: That backup could not be found.
RESTORED_THE_PREVIOUS_CORE: Restored the previous core.
COULD_NOT_LOAD_THE_UPDATE_STATUS: Could not load the update status.
THE_UPDATE_FAILED: The update failed.
THE_UPLOAD_FAILED: The upload failed.
THE_ROLLBACK_FAILED: The rollback failed.
COULD_NOT_DELETE_THE_STORED_VERSION: Could not delete the stored version.
TYPEMILLUPDATE_MSG_ALREADY_INSTALLED: "Typemill {version} is already installed."
TYPEMILLUPDATE_MSG_WORKDIR_FAILED: "Could not create the working directory {path}."
TYPEMILLUPDATE_MSG_ARCHIVE_VERSION_MISMATCH: "The archive contains Typemill {found}, but {requested} was requested."
TYPEMILLUPDATE_MSG_PHP_TOO_OLD: "Typemill {version} requires a newer PHP version than {php}."
TYPEMILLUPDATE_MSG_UPDATED: "Typemill was updated from {from} to {to}."
TYPEMILLUPDATE_MSG_UPLOAD_PHP_TOO_OLD: "That archive contains Typemill {version}, which needs a newer PHP version than {php}."
TYPEMILLUPDATE_CHECK_USABLE_SPACE_OK: There is enough space for an update.
TYPEMILLUPDATE_CHECK_USABLE_SPACE_SHORT: "Not enough space for an update; it needs {needed}. On shared hosting this is usually the account quota."
TYPEMILLUPDATE_CHECK_USABLE_SPACE_NOFILE: A test file could not be created in {root}.
TYPEMILLUPDATE_MSG_NOT_ENOUGH_SPACE: "Typemill {version} needs {needed} to unpack, and that much could not be written. On shared hosting this is usually the account quota."
TYPEMILLUPDATE_ERR_RENAME_UNSUPPORTED: This filesystem does not allow the system directory to be renamed, so the update was stopped before anything was changed. Update manually instead.
TYPEMILLUPDATE_ERR_CHECK_OFFLINE: typemill.net could not be reached. Check whether this server is allowed to make outgoing connections.
TYPEMILLUPDATE_ERR_CHECK_HTTP: "typemill.net answered with HTTP {status}."
TYPEMILLUPDATE_ERR_CHECK_FORMAT: typemill.net returned an unexpected version format.
TYPEMILLUPDATE_ERR_DOWNLOAD_FAILED: The release could not be downloaded.
TYPEMILLUPDATE_ERR_DOWNLOAD_HTTP: "The download failed with HTTP {status}."
TYPEMILLUPDATE_ERR_DOWNLOAD_OFFLINE: The download could not be started. Check whether this server is allowed to make outgoing connections.
TYPEMILLUPDATE_ERR_DOWNLOAD_TARGET: "The download could not be written to {path}."
TYPEMILLUPDATE_ERR_DOWNLOAD_EMPTY: The download was empty.
TYPEMILLUPDATE_ERR_ZIP_MISSING: The PHP zip extension is missing.
TYPEMILLUPDATE_ERR_ARCHIVE_UNREADABLE: The file is not a readable ZIP archive.
TYPEMILLUPDATE_ERR_ARCHIVE_UNREADABLE_ENTRY: The archive contains an entry that could not be read.
TYPEMILLUPDATE_ERR_ARCHIVE_TOO_MANY: "The archive contains more entries than expected ({entries})."
TYPEMILLUPDATE_ERR_ARCHIVE_TOO_BIG: "The archive expands to more than {limit}."
TYPEMILLUPDATE_ERR_ARCHIVE_UNSAFE_PATH: "The archive contains an unsafe path: {path}"
TYPEMILLUPDATE_ERR_ARCHIVE_NO_CORE: The archive does not contain a Typemill core. A system folder with typemill and vendor inside it is expected.
TYPEMILLUPDATE_ERR_ARCHIVE_MISSING_ENTRY: "The archive is missing {entry}, so it is not a complete Typemill core. Downloads from GitHub leave out the dependencies."
TYPEMILLUPDATE_ERR_ARCHIVE_NO_VERSION: The version could not be read from the archive.
TYPEMILLUPDATE_ERR_STAGE_FAILED: The new core could not be unpacked.
TYPEMILLUPDATE_ERR_STAGE_INCOMPLETE: The unpacked core is incomplete, so it was not installed.
TYPEMILLUPDATE_ERR_INSTALL_INCOMPLETE: The core to install is incomplete, so nothing was changed.
TYPEMILLUPDATE_ERR_INSTALL_MOVE_FAILED: The new core could not be moved into place. The previous core was restored.
TYPEMILLUPDATE_ERR_INSTALL_STRANDED: "The new core could not be moved into place and the previous core could not be restored. It is at {path}."
TYPEMILLUPDATE_ERR_BACKUP_DIRECTORY: The directory for the previous core could not be created.
TYPEMILLUPDATE_ERR_BACKUP_INCOMPLETE: That stored version does not contain a complete core.
TYPEMILLUPDATE_ERR_BACKUP_MISSING: That stored version does not exist.
TYPEMILLUPDATE_ERR_BACKUP_DELETE_FAILED: The stored version could not be deleted from disk.
TYPEMILLUPDATE_ERR_ROLLBACK_FAILED: The stored version could not be restored. The current core was put back.
TYPEMILLUPDATE_ERR_ROLLBACK_STRANDED: "The stored version could not be restored and the current core could not be put back. It is at {path}."
TYPEMILLUPDATE_ERR_UPLOAD_INVALID: Invalid upload.
TYPEMILLUPDATE_ERR_UPLOAD_CHUNK_TOO_LARGE: A piece of the upload was larger than expected.
TYPEMILLUPDATE_ERR_UPLOAD_CHUNK_DECODE: A piece of the upload could not be decoded.
TYPEMILLUPDATE_ERR_UPLOAD_DIRECTORY: The upload directory could not be created.
TYPEMILLUPDATE_ERR_UPLOAD_STORE: A piece of the upload could not be stored.
TYPEMILLUPDATE_ERR_UPLOAD_TARGET: The uploaded file could not be opened for writing.
TYPEMILLUPDATE_ERR_UPLOAD_INCOMPLETE: "The upload is incomplete; piece {chunk} is missing. Please upload the file again."
TYPEMILLUPDATE_ERR_UPLOAD_TOO_LARGE: "The uploaded file is larger than {limit}."
TYPEMILLUPDATE_ERR_UPLOAD_WRITE: The uploaded file could not be written.
TYPEMILLUPDATE_ERR_UPLOAD_EMPTY: The uploaded file is empty.
TYPEMILLUPDATE_ADMIN_ONLY: Only an administrator can install or restore a version.
