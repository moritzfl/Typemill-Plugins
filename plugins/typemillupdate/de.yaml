TYPEMILLUPDATE_PLUGIN_CONFIRM_TEXT: Der Plugin-Ordner wird durch das ZIP aus dem offiziellen Verzeichnis (https://plugins.typemill.net) ersetzt. Die Einstellungen des Plugins bleiben erhalten.
THE_PLUGIN_UPDATE_FAILED: Das Plugin-Update ist fehlgeschlagen.
TYPEMILLUPDATE_MSG_PLUGIN_SELF: Typemill-Update kann sich nicht selbst ersetzen.
TYPEMILLUPDATE_MSG_PLUGIN_NOT_INSTALLED: "Das Plugin {slug} ist nicht installiert."
TYPEMILLUPDATE_MSG_PLUGIN_NOT_DIRECTORY: "Das Plugin {slug} ist nicht im offiziellen Verzeichnis (https://plugins.typemill.net), daher kann es von hier nicht aktualisiert werden."
TYPEMILLUPDATE_MSG_PLUGIN_ALREADY: "{slug} {version} ist bereits installiert."
TYPEMILLUPDATE_MSG_PLUGIN_ARCHIVE_VERSION_MISMATCH: "Das Archiv enthält {slug} {found}, angefordert wurde aber {requested}."
TYPEMILLUPDATE_MSG_PLUGIN_NOT_ENOUGH_SPACE: "{slug} {version} braucht {needed} zum Entpacken, und so viel konnte nicht geschrieben werden."
TYPEMILLUPDATE_MSG_PLUGIN_UPDATED: "{slug} wurde von {from} auf {to} aktualisiert."
TYPEMILLUPDATE_ERR_PLUGIN_SLUG: Das ist kein gültiger Plugin-Name.
TYPEMILLUPDATE_ERR_PLUGIN_CHECK_OFFLINE: plugins.typemill.net war nicht erreichbar. Bitte prüfen, ob dieser Server ausgehende Verbindungen aufbauen darf.
TYPEMILLUPDATE_ERR_PLUGIN_CHECK_HTTP: "plugins.typemill.net hat mit HTTP {status} geantwortet."
TYPEMILLUPDATE_ERR_PLUGIN_CHECK_FORMAT: plugins.typemill.net hat einen unerwarteten Katalog zurückgegeben.
TYPEMILLUPDATE_ERR_PLUGIN_ARCHIVE_NO_PLUGIN: "Das Archiv enthält das Plugin {slug} nicht."
TYPEMILLUPDATE_ERR_PLUGIN_ARCHIVE_WRONG_SLUG: "Das Archiv enthält Dateien außerhalb des Plugins {slug}."
TYPEMILLUPDATE_ERR_PLUGIN_ARCHIVE_MISSING_ENTRY: "Im Archiv fehlt {entry}, damit ist es kein vollständiges Plugin."
TYPEMILLUPDATE_ERR_PLUGIN_STAGE_FAILED: Das neue Plugin konnte nicht entpackt werden.
TYPEMILLUPDATE_ERR_PLUGIN_INCOMPLETE: Das Plugin ist unvollständig und wurde deshalb nicht ersetzt.
TYPEMILLUPDATE_ERR_PLUGIN_PHP: Das neue Plugin-PHP ist syntaktisch ungültig und wurde deshalb nicht installiert.
TYPEMILLUPDATE_ERR_PLUGIN_SYMLINK: Dieses Plugin ist ein Symlink; es zu ersetzen wird nicht unterstützt.
TYPEMILLUPDATE_ERR_PLUGIN_WORKDIR: Das Arbeitsverzeichnis für Plugin-Updates konnte nicht angelegt werden.
TYPEMILLUPDATE_ERR_PLUGIN_BACKUP: Eine Sicherung des installierten Plugins konnte nicht angelegt werden.
TYPEMILLUPDATE_ERR_PLUGIN_RENAME_UNSUPPORTED: Dieses Dateisystem erlaubt es nicht, das Plugin-Verzeichnis umzubenennen. Das Update wurde gestoppt, bevor etwas verändert wurde.
TYPEMILLUPDATE_ERR_PLUGIN_INSTALL_MOVE_FAILED: Das neue Plugin konnte nicht an seinen Platz verschoben werden. Die vorherige Version wurde wiederhergestellt.
TYPEMILLUPDATE_ERR_PLUGIN_INSTALL_STRANDED: "Das neue Plugin konnte nicht an seinen Platz verschoben und die vorherige Version nicht wiederhergestellt werden. Sie liegt unter {path}."
