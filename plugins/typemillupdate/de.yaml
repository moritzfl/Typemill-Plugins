TYPEMILLUPDATE_TITLE: Typemill-Update
TYPEMILLUPDATE_SUBTITLE: Typemill selbst und ausschließlich Plugins aus dem offiziellen Verzeichnis (https://plugins.typemill.net) aktualisieren.
TYPEMILLUPDATE_INSTALLED: Installierte Version
TYPEMILLUPDATE_LATEST: Neueste Version
TYPEMILLUPDATE_UNKNOWN: Unbekannt
TYPEMILLUPDATE_UP_TO_DATE: Typemill ist aktuell.
TYPEMILLUPDATE_AVAILABLE: Ein Update ist verfügbar.
TYPEMILLUPDATE_CHECK: Erneut prüfen
TYPEMILLUPDATE_UPDATE_NOW: Jetzt aktualisieren
TYPEMILLUPDATE_ENVIRONMENT: Umgebung
TYPEMILLUPDATE_BLOCKED: Diese Installation kann sich nicht selbst aktualisieren. Bitte zuerst die folgenden Punkte beheben.
TYPEMILLUPDATE_BACKUPS: Frühere Versionen
TYPEMILLUPDATE_NO_BACKUPS: Noch keine frühere Version gespeichert.
TYPEMILLUPDATE_RESTORE: Wiederherstellen
TYPEMILLUPDATE_DELETE: Löschen
TYPEMILLUPDATE_LOADING: Lädt
TYPEMILLUPDATE_RUNNING: Update läuft. Diese Seite bitte nicht schließen.
TYPEMILLUPDATE_LOG: Details
TYPEMILLUPDATE_CONFIRM_TITLE: Typemill aktualisieren?
TYPEMILLUPDATE_CONFIRM_TEXT: Der system-Ordner wird ersetzt. Inhalte, Medien, Einstellungen und Themes bleiben unverändert, und der aktuelle Core wird zur Wiederherstellung aufbewahrt.
TYPEMILLUPDATE_CONFIRM_RESTORE_TITLE: Diese Version wiederherstellen?
TYPEMILLUPDATE_CONFIRM_RESTORE_TEXT: Der aktuelle Core wird durch den gespeicherten ersetzt.
TYPEMILLUPDATE_CANCEL: Abbrechen
TYPEMILLUPDATE_CONFIRM: Ja, fortfahren
TYPEMILLUPDATE_RELOAD: Seite neu laden, um die neue Version zu verwenden.
TYPEMILLUPDATE_PHP: PHP-Version
TYPEMILLUPDATE_UPLOAD_TITLE: Aus Datei installieren
TYPEMILLUPDATE_UPLOAD_HELP: "Ein Typemill-ZIP hochladen, um eine bestimmte Version zu installieren – etwa um zu einer älteren Version zurückzukehren oder wenn dieser Server typemill.net nicht erreichen kann. Das Archiv muss system/typemill und system/vendor enthalten; Downloads von GitHub enthalten die Abhängigkeiten nicht."
TYPEMILLUPDATE_UPLOADING: Wird hochgeladen
TYPEMILLUPDATE_UPLOADED_VERSION: Version in der Datei
TYPEMILLUPDATE_UPLOADED_SIZE: Datei
TYPEMILLUPDATE_CONFIRM_UPLOAD_TITLE: Diese Version installieren?
TYPEMILLUPDATE_CONFIRM_UPLOAD_TEXT: Der system-Ordner wird durch den Core aus dieser Datei ersetzt. Inhalte, Medien, Einstellungen und Themes bleiben unverändert, und der aktuelle Core wird zur Wiederherstellung aufbewahrt.
TYPEMILLUPDATE_DOWNGRADE_WARNING: Diese Version ist älter als die aktuell installierte.
TYPEMILLUPDATE_REINSTALL_WARNING: Diese Version ist bereits installiert.
TYPEMILLUPDATE_CHECK_ZIPARCHIVE_OK: Die PHP-Erweiterung zip ist vorhanden.
TYPEMILLUPDATE_CHECK_ZIPARCHIVE_MISSING: Die PHP-Erweiterung zip fehlt, daher kann das Release-Archiv nicht entpackt werden.
TYPEMILLUPDATE_CHECK_SYSTEM_LAYOUT_OK: system/typemill und system/vendor wurden in {root} gefunden.
TYPEMILLUPDATE_CHECK_SYSTEM_LAYOUT_MISSING: system/typemill und system/vendor wurden in {root} nicht gefunden.
TYPEMILLUPDATE_CHECK_SYSTEM_LAYOUT_SYMLINK: Das system-Verzeichnis ist ein Symlink; es zu ersetzen wird nicht unterstützt.
TYPEMILLUPDATE_CHECK_VENDOR_LOCATION_OK: Die Composer-Pakete liegen wie erwartet in system/vendor.
TYPEMILLUPDATE_CHECK_VENDOR_LOCATION_LEGACY: Diese Installation hält die Composer-Pakete in <root>/vendor, was älter ist als Typemill 2.23. Bitte manuell aktualisieren.
TYPEMILLUPDATE_CHECK_ROOT_WRITABLE_OK: PHP kann im Projektverzeichnis Einträge anlegen und umbenennen.
TYPEMILLUPDATE_CHECK_ROOT_WRITABLE_NOCREATE: PHP kann in {root} keine Einträge anlegen. Meist gehören die Dateien einem anderen Benutzer als dem Webserver.
TYPEMILLUPDATE_CHECK_ROOT_WRITABLE_NORENAME: PHP kann in {root} keine Einträge umbenennen, was das Update braucht, um das system-Verzeichnis auszutauschen.
TYPEMILLUPDATE_CHECK_OPCACHE_OFF: OPcache ist nicht aktiv.
TYPEMILLUPDATE_CHECK_OPCACHE_RESET: OPcache ist aktiv und wird nach dem Austausch zurückgesetzt.
TYPEMILLUPDATE_CHECK_OPCACHE_RESET_STALE: "OPcache läuft mit abgeschaltetem validate_timestamps; er wird nach dem Austausch zurückgesetzt."
TYPEMILLUPDATE_CHECK_OPCACHE_REVALIDATES: OPcache ist aktiv und prüft anhand des Zeitstempels erneut.
TYPEMILLUPDATE_CHECK_OPCACHE_MANUAL_RESTART: Bei OPcache ist validate_timestamps abgeschaltet und opcache_reset() steht nicht zur Verfügung. PHP nach dem Update bitte neu starten.
COULD_NOT_DETERMINE_THE_INSTALLED_TYPEMILL_VERSION: Die installierte Typemill-Version konnte nicht ermittelt werden.
THIS_INSTALLATION_CANNOT_UPDATE_ITSELF_SEE_THE_ENVIRONMENT_CHECKS: Diese Installation kann sich nicht selbst aktualisieren. Siehe die Umgebungsprüfungen.
THAT_UPLOADED_ARCHIVE_COULD_NOT_BE_FOUND_PLEASE_UPLOAD_IT_AGAIN: Das hochgeladene Archiv wurde nicht gefunden. Bitte erneut hochladen.
THAT_IS_NOT_A_VALID_VERSION_NUMBER: Das ist keine gültige Versionsnummer.
ANOTHER_UPDATE_IS_ALREADY_RUNNING: Es läuft bereits ein anderes Update.
COULD_NOT_CREATE_THE_WORKING_DIRECTORY: Das Arbeitsverzeichnis konnte nicht angelegt werden.
INVALID_UPLOAD: Ungültiger Upload.
THAT_BACKUP_COULD_NOT_BE_FOUND: Diese Sicherung wurde nicht gefunden.
RESTORED_THE_PREVIOUS_CORE: Der vorherige Core wurde wiederhergestellt.
COULD_NOT_LOAD_THE_UPDATE_STATUS: Der Update-Status konnte nicht geladen werden.
THE_UPDATE_FAILED: Das Update ist fehlgeschlagen.
THE_UPLOAD_FAILED: Der Upload ist fehlgeschlagen.
THE_ROLLBACK_FAILED: Die Rücksetzung ist fehlgeschlagen.
COULD_NOT_DELETE_THE_STORED_VERSION: Die gespeicherte Version konnte nicht gelöscht werden.
TYPEMILLUPDATE_MSG_ALREADY_INSTALLED: "Typemill {version} ist bereits installiert."
TYPEMILLUPDATE_MSG_WORKDIR_FAILED: "Das Arbeitsverzeichnis {path} konnte nicht angelegt werden."
TYPEMILLUPDATE_MSG_ARCHIVE_VERSION_MISMATCH: "Das Archiv enthält Typemill {found}, angefordert wurde aber {requested}."
TYPEMILLUPDATE_MSG_PHP_TOO_OLD: "Typemill {version} benötigt eine neuere PHP-Version als {php}."
TYPEMILLUPDATE_MSG_UPDATED: "Typemill wurde von {from} auf {to} aktualisiert."
TYPEMILLUPDATE_MSG_UPLOAD_PHP_TOO_OLD: "Das Archiv enthält Typemill {version} und benötigt eine neuere PHP-Version als {php}."
TYPEMILLUPDATE_CHECK_USABLE_SPACE_OK: Es ist genug Speicherplatz für ein Update vorhanden.
TYPEMILLUPDATE_CHECK_USABLE_SPACE_SHORT: "Zu wenig Speicherplatz für ein Update; benötigt werden {needed}. Auf Shared Hosting liegt das meist am Speicherkontingent des Kontos."
TYPEMILLUPDATE_CHECK_USABLE_SPACE_NOFILE: In {root} konnte keine Testdatei angelegt werden.
TYPEMILLUPDATE_MSG_NOT_ENOUGH_SPACE: "Typemill {version} braucht {needed} zum Entpacken, und so viel konnte nicht geschrieben werden. Auf Shared Hosting liegt das meist am Speicherkontingent des Kontos."
TYPEMILLUPDATE_ERR_RENAME_UNSUPPORTED: Dieses Dateisystem erlaubt es nicht, das system-Verzeichnis umzubenennen. Das Update wurde gestoppt, bevor etwas verändert wurde. Bitte manuell aktualisieren.
TYPEMILLUPDATE_ERR_CHECK_OFFLINE: typemill.net war nicht erreichbar. Bitte prüfen, ob dieser Server ausgehende Verbindungen aufbauen darf.
TYPEMILLUPDATE_ERR_CHECK_HTTP: "typemill.net hat mit HTTP {status} geantwortet."
TYPEMILLUPDATE_ERR_CHECK_FORMAT: typemill.net hat ein unerwartetes Versionsformat zurückgegeben.
TYPEMILLUPDATE_ERR_DOWNLOAD_FAILED: Die Version konnte nicht heruntergeladen werden.
TYPEMILLUPDATE_ERR_DOWNLOAD_HTTP: "Der Download ist mit HTTP {status} fehlgeschlagen."
TYPEMILLUPDATE_ERR_DOWNLOAD_OFFLINE: Der Download konnte nicht gestartet werden. Bitte prüfen, ob dieser Server ausgehende Verbindungen aufbauen darf.
TYPEMILLUPDATE_ERR_DOWNLOAD_TARGET: "Der Download konnte nicht nach {path} geschrieben werden."
TYPEMILLUPDATE_ERR_DOWNLOAD_EMPTY: Der Download war leer.
TYPEMILLUPDATE_ERR_ZIP_MISSING: Die PHP-Erweiterung zip fehlt.
TYPEMILLUPDATE_ERR_ARCHIVE_UNREADABLE: Die Datei ist kein lesbares ZIP-Archiv.
TYPEMILLUPDATE_ERR_ARCHIVE_UNREADABLE_ENTRY: Das Archiv enthält einen Eintrag, der nicht gelesen werden konnte.
TYPEMILLUPDATE_ERR_ARCHIVE_TOO_MANY: "Das Archiv enthält mehr Einträge als erwartet ({entries})."
TYPEMILLUPDATE_ERR_ARCHIVE_TOO_BIG: "Das Archiv entpackt sich auf mehr als {limit}."
TYPEMILLUPDATE_ERR_ARCHIVE_UNSAFE_PATH: "Das Archiv enthält einen unsicheren Pfad: {path}"
TYPEMILLUPDATE_ERR_ARCHIVE_NO_CORE: Das Archiv enthält keinen Typemill-Core. Erwartet wird ein system-Ordner mit typemill und vendor darin.
TYPEMILLUPDATE_ERR_ARCHIVE_MISSING_ENTRY: "Im Archiv fehlt {entry}, damit ist es kein vollständiger Typemill-Core. Downloads von GitHub enthalten die Abhängigkeiten nicht."
TYPEMILLUPDATE_ERR_ARCHIVE_NO_VERSION: Die Version konnte aus dem Archiv nicht gelesen werden.
TYPEMILLUPDATE_ERR_STAGE_FAILED: Der neue Core konnte nicht entpackt werden.
TYPEMILLUPDATE_ERR_STAGE_INCOMPLETE: Der entpackte Core ist unvollständig und wurde deshalb nicht installiert.
TYPEMILLUPDATE_ERR_INSTALL_INCOMPLETE: Der zu installierende Core ist unvollständig, es wurde nichts verändert.
TYPEMILLUPDATE_ERR_INSTALL_MOVE_FAILED: Der neue Core konnte nicht an seinen Platz verschoben werden. Der vorherige Core wurde wiederhergestellt.
TYPEMILLUPDATE_ERR_INSTALL_STRANDED: "Der neue Core konnte nicht an seinen Platz verschoben und der vorherige Core nicht wiederhergestellt werden. Er liegt unter {path}."
TYPEMILLUPDATE_ERR_BACKUP_DIRECTORY: Das Verzeichnis für den vorherigen Core konnte nicht angelegt werden.
TYPEMILLUPDATE_ERR_BACKUP_INCOMPLETE: Diese gespeicherte Version enthält keinen vollständigen Core.
TYPEMILLUPDATE_ERR_BACKUP_MISSING: Diese gespeicherte Version gibt es nicht.
TYPEMILLUPDATE_ERR_BACKUP_DELETE_FAILED: Die gespeicherte Version konnte nicht von der Festplatte gelöscht werden.
TYPEMILLUPDATE_ERR_ROLLBACK_FAILED: Die gespeicherte Version konnte nicht wiederhergestellt werden. Der aktuelle Core wurde zurückgelegt.
TYPEMILLUPDATE_ERR_ROLLBACK_STRANDED: "Die gespeicherte Version konnte nicht wiederhergestellt und der aktuelle Core nicht zurückgelegt werden. Er liegt unter {path}."
TYPEMILLUPDATE_ERR_UPLOAD_INVALID: Ungültiger Upload.
TYPEMILLUPDATE_ERR_UPLOAD_CHUNK_TOO_LARGE: Ein Teil des Uploads war größer als erwartet.
TYPEMILLUPDATE_ERR_UPLOAD_CHUNK_DECODE: Ein Teil des Uploads konnte nicht dekodiert werden.
TYPEMILLUPDATE_ERR_UPLOAD_DIRECTORY: Das Upload-Verzeichnis konnte nicht angelegt werden.
TYPEMILLUPDATE_ERR_UPLOAD_STORE: Ein Teil des Uploads konnte nicht gespeichert werden.
TYPEMILLUPDATE_ERR_UPLOAD_TARGET: Die hochgeladene Datei konnte nicht zum Schreiben geöffnet werden.
TYPEMILLUPDATE_ERR_UPLOAD_INCOMPLETE: "Der Upload ist unvollständig; Teil {chunk} fehlt. Bitte die Datei erneut hochladen."
TYPEMILLUPDATE_ERR_UPLOAD_TOO_LARGE: "Die hochgeladene Datei ist größer als {limit}."
TYPEMILLUPDATE_ERR_UPLOAD_WRITE: Die hochgeladene Datei konnte nicht geschrieben werden.
TYPEMILLUPDATE_ERR_UPLOAD_EMPTY: Die hochgeladene Datei ist leer.
TYPEMILLUPDATE_ADMIN_ONLY: Nur ein Administrator kann eine Version installieren oder wiederherstellen.
TYPEMILLUPDATE_PLUGINS: Plugins
TYPEMILLUPDATE_PLUGINS_HELP: Es können ausschließlich Plugins aus dem offiziellen Verzeichnis (https://plugins.typemill.net) aktualisiert werden.
TYPEMILLUPDATE_PLUGINS_NONE: Es sind keine Plugins aus dem offiziellen Verzeichnis (https://plugins.typemill.net) installiert.
TYPEMILLUPDATE_PLUGIN_BLOCKED: Plugins können nicht aktualisiert werden. Der plugins-Ordner muss beschreibbar sein und die PHP-Erweiterung zip muss vorhanden sein.
TYPEMILLUPDATE_PLUGIN_UPDATE: Aktualisieren
TYPEMILLUPDATE_PLUGIN_UP_TO_DATE: Aktuell
