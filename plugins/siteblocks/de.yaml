SB_INTRO: 'Inhalte einmal pflegen und mehrfach verwenden. Setzen Sie Bausteine verknüpft oder als eigenständige Kopie in Seiten ein. Das Anlegen allein zeigt sie noch nirgends auf Ihrer Website.'
SB_DRAFT_HELP: 'Speichern hält Ihren Entwurf privat. Veröffentlichen aktualisiert alle verknüpften Verwendungen dieses Bausteins.'
SB_NAME_HELP: 'Interner Name, keine sichtbare Überschrift.'
SB_PREVIEW_HELP: 'Die Einzelvorschau zeigt diesen Entwurf. Eine Seitenvorschau ersetzt vorhandene Verknüpfungen zu diesem Baustein nur für Sie.'
SB_FOOTER_HELP: 'Wählen Sie veröffentlichte Inhalte für die zusätzliche Theme-Fußzeile. Übernehmen ändert die Zuordnung sofort, veröffentlicht aber keine Entwürfe.'
SB_COPY_HELP: 'Verknüpfte Inhalte folgen zukünftigen Veröffentlichungen. Eine Kopie wird zu gewöhnlichem Inhalt in diesem Seitenentwurf.'
SB_LINKED_HELP: 'Dieser Inhalt wird zentral gepflegt. Bearbeiten Sie die Quelle für alle verknüpften Verwendungen oder lösen Sie eine Kopie für diese Seite.'
SB_HISTORY_HELP: 'Wiederherstellen erzeugt einen Entwurf. Veröffentlichen Sie ihn, damit die wiederhergestellten Inhalte sichtbar werden. Seitenversionen stellen Referenzen wieder her, nicht frühere Quellinhalte.'
SB_EXPORT_HELP: 'Der Export enthält Bausteine, Verlauf und Fußzeilenzuordnung dieses Projekts. Lokale Medien sichern Sie im Website-Export unter Papierkorb. Der Import erhält IDs und lehnt vorhandene Bausteine ab.'
SB_NOT_FOUND: Baustein nicht gefunden.
SB_NOT_AVAILABLE: Wählen Sie einen veröffentlichten, nicht archivierten Baustein.
