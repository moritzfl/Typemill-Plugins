SB_CANNOT_PUBLISH: Fügen Sie Inhalt hinzu und heben Sie die Archivierung vor dem Veröffentlichen auf.
SB_IN_USE: Dieser Baustein wird noch verwendet. Entfernen Sie zuerst seine Seiten- und Fußzeilenverknüpfungen.
