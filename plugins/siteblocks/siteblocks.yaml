name: Site Blocks
version: 1.0.0
description: 'Portable layout blocks, media galleries, tagged collections and shared footer fields. Native visual-editor integration with no theme dependency.'
author: Moritz
homepage: https://github.com/moritzfl/Typemill-Plugins
license: GPL-2.0
settings:
  expose_json: false
forms:
  fields:
    shared_footer_help:
      type: paragraph
      label: Shared footer
      description: SB_SHARED_FOOTER_HELP
      css: sb-shared-help
    column1:
      type: fieldset
      legend: Shared column 1
      fields:
        shared_title1:
          type: text
          label: Heading
        shared_text1:
          type: textarea
          label: Text
        shared_label1:
          type: text
          label: Link label
          css: lg:w-half
        shared_url1:
          type: text
          label: Link
          css: lg:w-half
    column2:
      type: fieldset
      legend: Shared column 2
      fields:
        shared_title2:
          type: text
          label: Heading
        shared_text2:
          type: textarea
          label: Text
        shared_label2:
          type: text
          label: Link label
          css: lg:w-half
        shared_url2:
          type: text
          label: Link
          css: lg:w-half
    column3:
      type: fieldset
      legend: Shared column 3
      fields:
        shared_title3:
          type: text
          label: Heading
        shared_text3:
          type: textarea
          label: Text
        shared_label3:
          type: text
          label: Link label
          css: lg:w-half
        shared_url3:
          type: text
          label: Link
          css: lg:w-half
    developer_help:
      type: paragraph
      label: Developer access
      description: 'Optional machine-readable page data. This does not change the footer.'
    expose_json:
      type: checkbox
      label: Public page JSON
      checkboxlabel: 'Enable /siteblocks.json?url=/page for public, visible pages'
metatabs:
  siteblocks:
    fields:
      tags:
        type: text
        label: Collection tags
        description: 'Comma-separated tags, for example news, youth, portfolio. Collections match a whole tag, ignoring case.'
