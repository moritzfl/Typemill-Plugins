name: Site Blocks
version: 2.0.0
description: 'Reusable Markdown content with drafts, publishing, page references and shared footer placement. Manage content in System → Content blocks.'
author: Moritz
homepage: https://github.com/moritzfl/Typemill-Plugins
license: GPL-2.0
settings:
  expose_json: false
forms:
  fields:
    expose_json:
      type: checkbox
      label: Public page JSON
      checkboxlabel: 'Enable /siteblocks.json?url=/page for public, visible pages'
metatabs:
  siteblocks:
    fields:
      tags:
        type: text
        label: Collection tags
        description: 'Comma-separated tags, for example news, youth, portfolio. Collections match a whole tag, ignoring case.'
